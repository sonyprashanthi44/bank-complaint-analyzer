services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bank_complaints
      POSTGRES_USER: bca
      POSTGRES_PASSWORD: bca
    ports:
      - "5432:5432"
    volumes:
      - bca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bca -d bank_complaints"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local-docker
      DATABASE_URL: postgresql+psycopg://bca:bca@db:5432/bank_complaints
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      LLM_PROVIDER: auto
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  bca_pgdata:
